name: Privacy check

# Every push and pull request: images must carry no metadata, text must hold no personal contact details
# or unexpected links, and the book data must still parse. See scripts/check-privacy.mjs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-privacy.mjs
